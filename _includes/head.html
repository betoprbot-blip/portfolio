<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta name="keywords" content="IT infrastructure, technical support, network engineering, telecommunications, remote troubleshooting, Austin TX, freelance">
<meta name="author" content="{{ site.author.name }}">
<meta name="robots" content="index, follow">

<!-- Open Graph -->
<meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">

<!-- Canonical -->
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<!-- Title -->
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "jobTitle": "IT Infrastructure & Technical Support Professional",
  "description": "{{ site.description }}",
  "url": "{{ site.url }}",
  "email": "{{ site.author.email }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Austin",
    "addressRegion": "TX",
    "addressCountry": "US"
  },
  "knowsAbout": [
    "IT Infrastructure",
    "Network Engineering",
    "Technical Support",
    "Telecommunications",
    "LAN/WAN Administration",
    "Virtualization",
    "VoIP",
    "System Monitoring",
    "Remote Troubleshooting"
  ]
}
</script>

<!-- Jekyll SEO tag (auto-generates additional meta) -->
{% seo %}
