title: Gilberto Miranda — IT Professional Portfolio
description: >-
  IT professional with 20+ years in telecommunications, network engineering, and technical support.
  Specializing in remote diagnostics, infrastructure automation, and operational efficiency.
  Based in Austin, TX. Open to remote/hybrid roles with location flexibility.
author:
  name: Gilberto Miranda
  email: beto-agent@agentmail.to
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/beto-agent
    - label: LinkedIn
      icon: fab fa-linkedin
      url: https://linkedin.com/in/gilberto-miranda
    - label: Email
      icon: fas fa-envelope
      url: mailto:beto-agent@agentmail.to

theme: minimal-mistakes-jekyll
remote_theme: "mmistakes/minimal-mistakes@4.28.0"

url: https://beto-agent.github.io
baseurl: /portfolio

plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at
  - jekyll-remote-theme

# SEO
google_site_verification:
bing_site_verification:

# Social
twitter:
  username:
facebook:
  username:
linkedin:
  username: gilberto-miranda

# Search
search: true
search_full_content: true
search_provider: lunr

# Analytics
analytics:
  provider: google-gtag
  google:
    tracking_id:
    anonymize_ip: false

# Navigation
navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Projects
    url: /projects/
  - title: Resume
    url: /resume/
  - title: Blog
    url: /blog/

# Footer
footer:
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/beto-agent
    - label: LinkedIn
      icon: fab fa-linkedin
      url: https://linkedin.com/in/gilberto-miranda
    - label: Email
      icon: fas fa-envelope
      url: mailto:beto-agent@agentmail.to

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
      read_time: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
      read_time: true
      show_date: true

# Include cache
include: [".well-known"]

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .github
  - README.md
  - LICENSE