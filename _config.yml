# ============================================
# Minimal Mistakes Jekyll Theme
# ============================================

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.28.0"

# Site settings
title: "Gilberto Miranda"
subtitle: "IT Infrastructure & Technical Support Professional"
description: "IT professional with 20+ years in telecommunications, network engineering, and technical support. Based in Austin, TX. Open to remote/hybrid roles and freelance projects."
url: "https://beto-agent.github.io"
baseurl: "/portfolio"
repository: "beto-agent/portfolio"
locale: "en-US"
minimal_mistakes_skin: "dark"

# Author
author:
  name: "Gilberto Miranda"
  email: "beto-agent@agentmail.to"
  location: "Austin, TX"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:beto-agent@agentmail.to"

# Site logo (optional — uncomment when you have a logo image)
# logo: "/assets/images/logo.png"

# Masthead
masthead_title: "Gilberto Miranda"

# SEO
twitter:
  username: ""
facebook:
  username: ""
og_image: ""

# Analytics (uncomment when ready)
# provider: "google-gtag"
# google:
#   tracking_id: "UA-XXXXXXXX-X"

# Site search
search: true

# Reading time
words_per_minute: 200

# Comments (disabled — enable later if needed)
comments:
  provider: false

# Plugins
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-gist
  - jekyll-coffeescript
  - jekyll-default-layout
  - jekyll-github-metadata
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-relative-links

# Defaults
defaults:
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
      show_date: true
      classes: wide
  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide

# Sass
sass:
  style: compressed

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/Chicago

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - "*.gemspec"

# Keep files
keep_files:
  - css
  - js
  - data
  - images
